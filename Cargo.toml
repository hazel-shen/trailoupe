[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
trailoupe-core = { path = "crates/trailoupe-core" }

rusqlite = { version = "0.42", features = ["bundled"] }
plist = "1.10"
tar = "0.4"
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Input data is untrusted: never panic while parsing it.
# Tests are exempted via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
